<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fog" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#cbd5e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Tree Silhouette (Faded) -->
  <g fill="#64748b" opacity="0.3">
    <rect x="240" y="300" width="30" height="100"/>
    <circle cx="256" cy="280" r="60"/>
    <circle cx="220" cy="300" r="40"/>
    <circle cx="290" cy="300" r="40"/>
  </g>
  <!-- Fog Lines -->
  <rect x="50" y="350" width="400" height="20" rx="10" fill="url(#fog)"/>
  <rect x="100" y="300" width="300" height="20" rx="10" fill="url(#fog)"/>
  <rect x="80" y="400" width="350" height="20" rx="10" fill="url(#fog)"/>
  <rect x="150" y="250" width="200" height="20" rx="10" fill="url(#fog)"/>
</svg>
