<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bae6fd;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#coldGradient)"/>
  <!-- Snowflake -->
  <g stroke="#0ea5e9" stroke-width="12" stroke-linecap="round" transform="translate(256, 256)">
    <line x1="0" y1="-100" x2="0" y2="100" />
    <line x1="-86.6" y1="-50" x2="86.6" y2="50" />
    <line x1="-86.6" y1="50" x2="86.6" y2="-50" />
    
    <!-- Tips -->
    <path d="M0 -100 L -20 -120 M 0 -100 L 20 -120" fill="none"/>
    <path d="M0 100 L -20 120 M 0 100 L 20 120" fill="none"/>
    <path d="M86.6 -50 L 106.6 -40 M 86.6 -50 L 96.6 -70" fill="none"/>
     <path d="M-86.6 50 L -106.6 40 M -86.6 50 L -96.6 70" fill="none"/>
  </g>
  <!-- Thermometer Low -->
  <g transform="translate(400, 300)">
    <rect x="-10" y="-80" width="20" height="100" rx="10" fill="white" stroke="#64748b" stroke-width="2"/>
    <circle cx="0" cy="30" r="20" fill="#3b82f6"/>
    <rect x="-5" y="0" width="10" height="30" fill="#3b82f6"/>
  </g>
</svg>
